<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tamil Word Blitz Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      background-color: #007BFF;
      color: white;
      padding: 20px;
      margin: 0;
      font-size: 2.5rem;
    }

    #letters {
      font-size: 2rem;
      margin: 20px;
      padding: 10px;
      background-color: #f1f1f1;
      border-radius: 10px;
      display: inline-block;
      color: #333;
      font-weight: bold;
    }

    input[type="text"] {
      padding: 10px;
      font-size: 1.2rem;
      width: 250px;
      margin: 15px 0;
      border: 2px solid #007BFF;
      border-radius: 5px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #0056b3;
    }

    button {
      padding: 10px 20px;
      font-size: 1.2rem;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    #score, #timer {
      font-size: 1.3rem;
      margin: 10px;
      color: #333;
    }

    #used-words {
      list-style: none;
      padding: 0;
      margin-top: 20px;
      font-size: 1rem;
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
      padding-left: 40%;
    }

    li {
      background-color: #f1f1f1;
      margin: 5px 0;
      padding: 5px;
      border-radius: 5px;
      color: #333;
    }

    li:nth-child(even) {
      background-color: #e9e9e9;
    }

   
    .alert {
      color: red;
      font-size: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Word Forming Game </h1>

  <div id="letters">---</div>

  <input type="text" id="word-input" placeholder="Enter a word..." />
  <button onclick="submitWord()">Submit</button>

  <div id="score">Score: 0</div>
  <div id="timer">Time left: 60 seconds</div>

  <h3>Used Words:</h3>
  <ul id="used-words"></ul>

  <script src="script.js"></script>
</body>
</html>
